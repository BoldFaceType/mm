name: Slice Governance

on:
  pull_request:
    branches:
      - feat/vertical-slice-base

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate board events
        run: npm run validate:board

      - name: Check JS syntax
        run: npm run check:syntax

      - name: Type-check JS scripts
        run: npm run check:types

      - name: Run unit tests
        run: npm test

      - name: Check formatting
        run: |
          npx --yes prettier@3.5.3 --check "*.{js,html,md}" \
            "scripts/**/*.mjs" \
            "tests/**/*.mjs" \
            "board/**/*.json" \
            ".github/workflows/*.yml"
