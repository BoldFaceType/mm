<!DOCTYPE html>
<html lang="en">

<head>
  <title>mm</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      /* font-family: Monospace; */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 24px;
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #info {
      position: absolute;
      top: 0px;
      left: 25vw;
      right: 25vw;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
      font-size: 15px;
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    /* menu */

    .lil-gui {
      --folder-indent: 12px;
      --title-background-color: #555;
    }

    .lil-gui.autoPlace {
      right: 0;
    }

    .lil-gui .title {
      background-color: #555;
    }

    .lil-gui .lil-gui>.children {
      margin-left: var(--folder-indent);
    }

    .lil-gui .allow-touch-styles {
      border-left: 1px solid var(--widget-color);
    }

    .lil-gui .lil-gui .lil-gui>.children {
      margin-left: var(--folder-indent);
      border-left: none;
    }

    /* instructions */

    .instructions-modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      padding: 10px;
      background-color: rgb(0, 0, 0);
      background-color: rgba(0, 0, 0, 0.3);
    }

    .instructions-content,
    .minimized-content {
      position: relative;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid #333;
      box-sizing: border-box;
      color: #ccc;
    }

    .instructions-content {
      padding: 16px;
      padding-top: 30px;
      padding-bottom: 20px;
      padding-right: 40px;
    }

    .minimized-content {
      padding-left: 30px;
      padding-bottom: 20px;
      padding: 2px;
      width: 36px;
      height: 40px;
    }

    .control-btn {
      position: absolute;
      font-family: Monospaced;
      color: #fff;
      top: 4px;
      left: 25px;
      font-size: 24px;
    }

    .control-btn:hover,
    .control-btn:focus {
      text-decoration: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .leftcol {
      color: #fff;
    }

    table,
    th,
    td {
      border: 1px solid black;
      padding: 6px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    #mobile-instructions {
      display: none;
    }

    @media screen and (max-width: 600px) {
      #laptop-instructions {
        display: none;
      }

      #mobile-instructions {
        display: block;
      }
    }

    /* --- GGUF tensor picker --- */

    #gguf-picker {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.55);
      font-family: monospace;
      font-size: 12px;
    }

    #gguf-picker.open {
      display: block;
    }

    #gguf-picker-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(760px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: #1b1b1b;
      color: #e8e8e8;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    #gguf-picker-head {
      padding: 10px 12px;
      border-bottom: 1px solid #333;
    }

    #gguf-picker-file {
      font-weight: bold;
      word-break: break-all;
    }

    #gguf-picker-sub {
      color: #999;
      margin-top: 3px;
    }

    #gguf-picker-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
    }

    #gguf-picker-controls label {
      color: #bbb;
    }

    #gguf-filter {
      flex: 1 1 180px;
      min-width: 140px;
      background: #111;
      color: #e8e8e8;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: inherit;
    }

    #gguf-picker-list {
      overflow: auto;
      flex: 1 1 auto;
    }

    #gguf-picker-list table {
      width: 100%;
      border-collapse: collapse;
    }

    #gguf-picker-list th {
      position: sticky;
      top: 0;
      background: #262626;
      text-align: left;
      padding: 5px 8px;
      color: #aaa;
      font-weight: normal;
      border-bottom: 1px solid #383838;
    }

    #gguf-picker-list td {
      padding: 4px 8px;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }

    #gguf-picker-list td.tname {
      white-space: normal;
      word-break: break-all;
    }

    #gguf-picker-list tr.pick {
      cursor: pointer;
    }

    #gguf-picker-list tr.pick:hover {
      background: #2f3b2f;
    }

    #gguf-picker-list tr.blocked {
      color: #8a8a8a;
    }

    #gguf-picker-list tr.blocked td.why {
      color: #d08a6a;
    }

    #gguf-picker-foot {
      padding: 8px 12px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .gguf-btn {
      background: #333;
      color: #e8e8e8;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
    }

    .gguf-btn:hover {
      background: #444;
    }

    #gguf-status {
      display: none;
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 1900;
      max-width: min(560px, 90vw);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      background: #1b1b1b;
      color: #e8e8e8;
      border: 1px solid #444;
    }

    #gguf-status.show {
      display: block;
    }

    #gguf-status.error {
      border-color: #a5442e;
      color: #ffb59b;
    }
  </style>
</head>

<body>
  <div id="info">loading</div>
  <div id="container"></div>

  <div id="gguf-status"></div>

  <div id="gguf-picker">
    <div id="gguf-picker-panel">
      <div id="gguf-picker-head">
        <div id="gguf-picker-file"></div>
        <div id="gguf-picker-sub"></div>
      </div>
      <div id="gguf-picker-controls">
        <label for="gguf-operand">load into</label>
        <select id="gguf-operand" class="gguf-btn">
          <option value="left">left (L)</option>
          <option value="right">right (R)</option>
        </select>
        <label><input type="checkbox" id="gguf-fit" checked> resize matrix to tensor</label>
        <input id="gguf-filter" type="text" placeholder="filter by name" autocomplete="off">
      </div>
      <div id="gguf-picker-list"></div>
      <div id="gguf-picker-foot">
        <span id="gguf-picker-count"></span>
        <button id="gguf-cancel" class="gguf-btn">cancel</button>
      </div>
    </div>
  </div>
  <div id="instructions" class="instructions-modal">
    <div id="minimized" class="minimized-content">
      <span id="maximize" class="control-btn">&gt;</span>
    </div>
    <div id="instructions-content" class="instructions-content">
      <span id="minimize" class="control-btn">&lt;</span>
      <div id="laptop-instructions">
        <table>
          <tr>
            <td class="leftcol">Zoom</td>
            <td>Two finger swipe</td>
          </tr>
          <tr>
            <td class="leftcol">Spin</td>
            <td>Click + drag</td>
          </tr>
          <tr>
            <td class="leftcol">Pan</td>
            <td>Cmd-click + drag</td>
          </tr>
          <tr>
            <td class="leftcol">Reveal</td>
            <td>Long click + drag</td>
          </tr>
          <tr>
            <td>
              <a class="leftcol" target="_blank" onclick="event.stopPropagation()" href="ref.html">Reference</a>
            </td>
          </tr>
        </table>
      </div>
      <div id="mobile-instructions">
        <table>
          <tr>
            <td class="leftcol">Zoom</td>
            <td>Pinch</td>
          </tr>
          <tr>
            <td class="leftcol">Spin</td>
            <td>Tap and drag</td>
          </tr>
          <tr>
            <td class="leftcol">Pan</td>
            <td>Two-finger drag</td>
          </tr>
          <tr>
            <td class="leftcol">Reveal</td>
            <td>Long tap + drag</td>
          </tr>
          <tr>
            <td>
              <a class="leftcol" target="_blank" onclick="event.stopPropagation()" href="ref.html">Reference</a>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>

  <!-------------------------- code -------------------------->

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="./lib/es-module-shims.js"></script>

  <script type="importmap">
			{
        "imports": {
          "three": "./lib/three.module.js",
          "three/addons/": "./lib/jsm/",
          "lil-gui": "./lib/lil-gui.js"
        }
      }
  </script>

  <script type="module">
    "use strict"

    import * as THREE from 'three'

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

    import * as viz from './viz.js'
    import * as util from './util.js'
    import * as gui from './gui.js'

    //
    // params start with single-mm default, get updated from url params
    //

    const params = {
      expr: 'L @ R',
      name: 'L @ R',
      epilog: viz.default_epilog,
      left: viz.defaultLeft(),
      right: viz.defaultRight(),
      anim: {
        fuse: 'none',
        speed: 20,
        'hide inputs': false,
        alg: 'none',
        spin: 0,
      },
      block: viz.defaultBlock(),
      layout: {
        scheme: 'blocks',
        gap: 4,
        scatter: 0,
        molecule: 1,
        blast: 0,
        ...viz.defaultLayout(),
      },
      deco: {
        legends: 6,
        shape: true,
        spotlight: 2,
        'row guides': 0.6,
        'flow guides': 0.5,
        'lens size': 0.5,
        'magnification': 7,
        'interior spotlight': false,
        axes: false,
      },
      viz: {
        sensitivity: 'global',
        'min size': 0.2,
        'min light': 0.4,
        'max light': 0.7,
        'elem scale': 1.25,
        'zero hue': 0.77,
        'hue gap': 0.74,
        'hue spread': 0.04,
      },
      diag: {
        url: '',
      },
      cam: viz.defaultCam()
    }

    // we use this when resetting via message passing
    const default_params = (() => {
      const p = util.copyTree(params)
      delete p.cam // interferes with camera placement
      return p
    })()

    function resetParams() {
      Object.entries(util.copyTree(default_params)).forEach(([k, v]) => params[k] = v)
      params.cam = viz.defaultCam()
    }

    function updateTitle() {
      document.getElementById('info').innerHTML = viz.genExpr(params)
    }

    const url_info = { json: '', url: urlPrefix(), compressed: '', search_params: '' }

    function urlPrefix() {
      return window.location.origin + window.location.pathname
    }

    function saveUrlInfo() {
      url_info.json = JSON.stringify(params)
      const prefix = urlPrefix()
      let search_params = util.makeSearchParams(params)
      // not the cleanest place to do it, but - turn compression on when params get big
      if (!params.compress && search_params.toString().length > 2048) {
        params.compress = true
        search_params = util.makeSearchParams(params)
      }
      // url is whatever we're putting in history, compressed is always compressed
      url_info.url = prefix + '?' + search_params
      url_info.compressed = prefix + '?' + util.makeSearchParams({ ...params, compress: true })
      url_info.search_params = '' + search_params
    }

    function saveUrl() {
      saveUrlInfo()
      window.history.pushState({}, '', url_info.url)
      // send to parent if we're in an iframe
      if (window.parent != window) {
        window.parent.postMessage({ search_params: url_info.search_params }, parent.origin)
      }
    }

    // obj

    let obj

    const getObj = () => obj

    function initObj() {

      let oldmag
      if (obj) {
        const oldsz = util.bbhwd(obj.getBoundingBox())
        oldmag = oldsz.h + oldsz.w + oldsz.d
        scene.remove(obj.group)
        obj.disposeAll()
      }

      obj = new viz.MatMul(params, getContext())
      obj.group.rotation.x = Math.PI
      obj.center()

      if (oldmag) {
        const newsz = util.bbhwd(obj.getBoundingBox())
        const newmag = newsz.h + newsz.w + newsz.d
        const ratio = newmag / oldmag
        if (ratio != 1) {
          console.log(`HEY ratio ${ratio}`)
          camera.position.set(camera.position.x * ratio, camera.position.y * ratio, camera.position.z * ratio)
          orbit.update()
          requestCameraPositionSave()
        }
      }

      obj.setLegends()
      obj.initAnimation()
      scene.add(obj.group)

      updateTitle()
    }

    //
    // three.js scene hookup
    //

    const aspect = () => window.innerWidth / window.innerHeight
    const fov = () => 45 / Math.min(1, aspect())

    const camera = new THREE.PerspectiveCamera(fov(), aspect(), 5, 10000)
    const pointer = new THREE.Vector2(-1, -1)
    const raycaster = new THREE.Raycaster()
    // raycaster.far = 100
    raycaster.params.Points.threshold = 0
    raycaster.setFromCamera(pointer, camera)

    const scene = new THREE.Scene()

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(window.devicePixelRatio)
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.getElementById('container').appendChild(renderer.domElement)

    // diag info updated on render
    const render_info = renderer.info.memory

    // object params plus env stuff for text, spotlight, isFacing etc
    function getContext() {
      return {
        raycaster: raycaster,
        camera: camera,
        pointer: pointer,
      }
    }

    // orbit control

    const orbit = new OrbitControls(camera, renderer.domElement)
    orbit.keys = { LEFT: orbit.keys.LEFT, RIGHT: orbit.keys.RIGHT }
    orbit.zoomSpeed = 0.2
    orbit.listenToKeyEvents(window)

    const viewState = () => ({
      ...camera.position,
      target: { ...orbit.target }
    })

    let cam_changing = false

    let spin_stash = 0
    let view_stash
    orbit.addEventListener('start', () => {
      spin_stash = params.anim.spin
      view_stash = viewState()
      params.anim.spin = 0
      cam_changing = true
    })

    orbit.addEventListener('change', () => {
      params.cam = viewState()
    }, false)

    // update object labels from view changes
    // throttle a little

    let mag

    const updateSpotlight = () => {
      if (mag) {
        const mag_pointer = pointer.clone()
        mag_pointer.y += params.deco['lens size'] / params.deco.magnification
        raycaster.setFromCamera(mag_pointer, camera)
        raycaster.far = Infinity
      } else {
        raycaster.far = 0
      }
      obj.updateLabels()
    }

    let label_update_pending = false
    const requestLabelUpdate = (legends_only = false) => {
      if (!label_update_pending) {
        label_update_pending = true
        setTimeout(() => {
          label_update_pending = false
          raycaster.setFromCamera(pointer, camera)
          obj.setLegends()
          if (!legends_only) {
            updateSpotlight()
          }
        }, 10)
      }
    }

    // update params from camera changes
    // zooms can blast these

    let camera_save_pending = false
    let last_camera_save_request = 0
    const requestCameraPositionSave = () => {
      last_camera_save_request = performance.now()
      if (!camera_save_pending) {
        camera_save_pending = true
        setTimeout(() => {
          camera_save_pending = false
          const t = performance.now()
          if (t - last_camera_save_request > 250) {
            saveUrl()
          } else {
            requestCameraPositionSave()
          }
        }, 250)
      }
    }

    orbit.addEventListener('end', () => {
      params.anim.spin = spin_stash
      // these happen only at the end of drags, but multiple times per zoom
      cam_changing = false
      requestLabelUpdate()
      if (JSON.stringify(view_stash) != JSON.stringify(viewState())) {
        requestCameraPositionSave()
      }
    })

    //
    // browser hookups
    //

    function initFromParams(save = true) {
      save && saveUrlInfo()
      camera.position.set(params.cam.x, params.cam.y, params.cam.z)
      params.cam.target && util.updateProps(orbit.target, params.cam.target)
      orbit.update()
      initAxes(params.deco.axes)
      initObj()

      // gui setup happens here but probably shouldn't
      const callbacks = { initObj, getObj, saveUrl, updateTitle, animPause, animStep }
      const info = { url_info, render_info }
      gui.initGui(params, callbacks, info)
    }

    function initFromSearchParams() {
      const searchParams = new URL(window.location).searchParams
      if (searchParams.size > 0) {
        util.updateObjectFromSearchParams(params, searchParams)
      } else {
        resetParams()
      }
      if (params.sync_expr !== undefined) {
        delete params.sync_expr
      }
      params.expr = viz.genExpr(params)
      initFromParams(false)
    }

    window.addEventListener('popstate', initFromSearchParams, false)

    window.addEventListener('resize', () => {
      camera.fov = fov()
      camera.aspect = aspect()
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
      syncVizToRenderer(true)
    })

    let pointer_start
    let pointer_moved
    let pointer_move_timeout

    let clientX = 0
    let clientY = 0
    window.addEventListener('pointermove', e => {
      clientX = e.clientX
      clientY = e.clientY
      pointer.x = e.clientX / window.innerWidth * 2 - 1
      pointer.y = -(e.clientY / window.innerHeight * 2 - 1)
      pointer_moved = true
      if (!cam_changing) {
        requestLabelUpdate()
      }
    })

    window.addEventListener('pointerdown', e => {
      clientX = e.clientX
      clientY = e.clientY
      pointer.x = e.clientX / window.innerWidth * 2 - 1
      pointer.y = -(e.clientY / window.innerHeight * 2 - 1)
      pointer_moved = false
      pointer_start = Date.now()
      pointer_move_timeout = setTimeout(() => {
        if (!pointer_moved && e.target === renderer.domElement) {
          mag = true
          orbit.enabled = false
          cam_changing = false
          updateSpotlight()
        }
      }, 500)
    })

    window.addEventListener('pointerup', e => {
      clearTimeout(pointer_move_timeout)
      mag = false
      orbit.enabled = true
      updateSpotlight()
    })

    const key_funcs = {
      'Space': () => {
        let init = false
        if (params.anim.alg == 'none') {
          params.anim.alg = last_anim_alg
          init = true
        } else if (anim_pause) {
          animPause(false)
        } else {
          last_anim_alg = params.anim.alg
          params.anim.alg = 'none'
          init = true
        }
        if (params.anim.spin == 0) {
          params.anim.spin = last_anim_spin
          init = true
        } else {
          last_anim_spin = params.anim.spin
          params.anim.spin = 0
          init = true
        }
        init && initObj()
      },
      'ArrowUp': () => {
        const e = new WheelEvent('wheel', { deltaY: 1 })
        orbit.domElement.dispatchEvent(e)
      },
      'ArrowDown': () => {
        const e = new WheelEvent('wheel', { deltaY: -1 })
        orbit.domElement.dispatchEvent(e)
      },
      'KeyP': () => { // p
        if (params.anim.alg != 'none') {
          animPause(!anim_pause)
        }
      },
      'KeyS': () => { // s
        if (params.anim.alg != 'none') {
          animPause(true)
          animStep()
        }
      },
    }

    window.addEventListener('keydown', e => {
      if (e.ctrlKey) {
        mag = true
        updateSpotlight()
        return
      }
      const kf = key_funcs[e.code]
      kf && kf(e)
    })

    window.addEventListener('keyup', e => {
      if (mag) {
        mag = false
        updateSpotlight()
      }
    })

    // comms w/outside world (we're in an iframe, e.g.)

    const RESPONDERS = {
      getUrlInfo: () => {
        // console.log(`HEY getUrlInfo called`)
        event.source.postMessage({ url_info }, event.origin)
      },
      getParams: () => {
        // console.log(`HEY getParams called`)
        event.source.postMessage({ params }, event.origin)
      },
      setParams: ({ props = {}, reset = false }) => {
        console.log(`HEY setParams called props ${JSON.stringify(props)} reset ${reset}`)
        reset && resetParams()

        if (props.sync_expr) {
          params.expr = props.expr
          viz.syncExpr(params)
          delete props.sync_expr
        }
        util.updatePropsRec(params, props)
        params.expr = viz.genExpr(params)
        if (props.layout?.scheme) {
          viz.setLayoutScheme(params)
        }
        initFromParams()
      }
    }

    window.addEventListener('message', event => {
      Object.entries(event.data).forEach(([k, v]) => {
        const r = RESPONDERS[k]
        r && r(v)
      })
    })

    // diag info updated on resize
    const display_info = { x: 0, y: 0, z: 0, devicePixelRatio: 0 }

    function syncVizToRenderer(reinit = false) {
      renderer.setPixelRatio(window.devicePixelRatio)
      const size = renderer.getSize(new THREE.Vector3())
      viz.setElemSize(size, window.devicePixelRatio)
      util.updateProps(display_info, size)
      display_info.devicePixelRatio = window.devicePixelRatio
      reinit && initObj()
    }

    syncVizToRenderer() // first time thru

    const pixel_ratio_watcher = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
    pixel_ratio_watcher.addEventListener('change', _ => syncVizToRenderer(true))

    //
    // animation
    //

    // for spacebar control
    let last_anim_alg = params.anim.alg
    let last_anim_spin = params.anim.spin

    // animation loop circuit breaker
    let anim_pause = false
    function animPause(p) {
      anim_pause = p
    }

    let anim_step = false
    function animStep() {
      if (anim_pause) {
        anim_step = true
      }
    }

    // axes
    const axes = util.axes()
    function initAxes(enabled) {
      if (enabled) {
        scene.add(axes)
      } else {
        scene.remove(axes)
      }
    }

    let last_render = 0, last_anim = 0

    function animate() {
      const t = performance.now()
      if (params.anim.alg != 'none' &&
        (anim_step || !anim_pause) &&
        (t - last_render) > (1000 / params.anim.speed)) {
        obj.bump()
        last_render = t
        anim_step = false
      }

      if (params.anim.spin != 0) {
        const rad = (last_anim - t) * params.anim.spin / 20000
        const [cos, sin] = [Math.cos(rad), Math.sin(rad)]
        const { x, z } = camera.position
        util.updateProps(camera.position, { x: cos * x + sin * z, z: cos * z - sin * x })
        camera.lookAt(orbit.target.x, orbit.target.y, orbit.target.z)
        requestLabelUpdate(true)
      }

      last_anim = t

      util.updateProps(render_info, renderer.info.memory)
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight)
      renderer.render(scene, camera)

      if (mag) {
        const m = params.deco.magnification
        const size = window.innerHeight * params.deco['lens size']
        const x = clientX - size / 2
        const y = window.innerHeight - clientY
        const offsetX = clientX - size / 2 / m
        const offsetY = clientY - size / m

        const mag_camera = camera.clone()
        mag_camera.setViewOffset(
          window.innerWidth,
          window.innerHeight,
          offsetX,
          offsetY,
          size / m,
          size / m
        )

        renderer.setViewport(x, y, size, size)
        renderer.setScissorTest(true)
        renderer.setScissor(x, y, size, size)

        viz.MATERIAL.uniforms.mag.value = m
        renderer.render(scene, mag_camera)
        viz.MATERIAL.uniforms.mag.value = 1.0

        renderer.setScissorTest(false)
      }

      requestAnimationFrame(animate)
    }

    // instructions hover

    window.onload = () => {
      const instr = document.getElementById('instructions')
      const instr_content = document.getElementById('instructions-content')
      const min_content = document.getElementById('minimized')
      const min_button = document.getElementById('minimize')
      const max_button = document.getElementById('maximize')

      const show = () => {
        instr_content.style.display = "block"
        min_content.style.display = "none"
        min_button.style.display = "block"
        max_button.style.display = "none"
      }

      const hide = () => {
        instr_content.style.display = "none"
        min_content.style.display = "block"
        min_button.style.display = "none"
        max_button.style.display = "block"
      }

      min_button.onclick = hide
      instr_content.onclick = hide
      max_button.onclick = show

      instr.style.display = "block"
      show()
    }

    // Re-init when an async GGUF decode completes, and surface load state for
    // loads that did not come from the picker (a gguf_url typed into the GUI,
    // or restored from the URL).
    window.addEventListener('gguf-loaded', e => {
      if (!e.detail || !e.detail.stale) initObj()
    })

    window.addEventListener('gguf-state', e => {
      const { tensorName, status, error } = e.detail
      if (status === 'error') {
        ggufStatus(`could not load ${tensorName}: ${error}`, 'error')
      } else if (status === 'loading') {
        ggufStatus(`loading ${tensorName}...`)
      } else if (status === 'ready') {
        ggufStatus('')
      }
    })

    //
    // GGUF import: drop a file, pick a tensor, map it into an operand
    //

    const MAX_MATRIX_DIM = 1024   // matches the h/w GUI range

    const ggufStatusEl = document.getElementById('gguf-status')

    function ggufStatus(message, kind = 'info') {
      if (!message) {
        ggufStatusEl.className = ''
        ggufStatusEl.textContent = ''
        return
      }
      ggufStatusEl.textContent = message
      ggufStatusEl.className = kind === 'error' ? 'show error' : 'show'
    }

    const pickerEl    = document.getElementById('gguf-picker')
    const pickerFile  = document.getElementById('gguf-picker-file')
    const pickerSub   = document.getElementById('gguf-picker-sub')
    const pickerList  = document.getElementById('gguf-picker-list')
    const pickerCount = document.getElementById('gguf-picker-count')
    const operandEl   = document.getElementById('gguf-operand')
    const fitEl       = document.getElementById('gguf-fit')
    const filterEl    = document.getElementById('gguf-filter')

    let pickerState = null   // { source, label, tensors }

    const closePicker = () => {
      pickerEl.classList.remove('open')
      pickerState = null
    }

    document.getElementById('gguf-cancel').addEventListener('click', closePicker)
    pickerEl.addEventListener('click', e => { if (e.target === pickerEl) closePicker() })
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pickerEl.classList.contains('open')) closePicker()
    })
    filterEl.addEventListener('input', () => renderPickerList())

    // Why a tensor cannot be mapped into a 2D operand, or '' if it can.
    function blockedReason(t) {
      if (!t.supported) return `${t.quantType} not decodable`
      if (t.rank > 2) return `rank ${t.rank} — 2D only`
      const [h, w] = t.shape
      if (h < 1 || w < 1) return 'empty tensor'
      return ''
    }

    function renderPickerList() {
      if (!pickerState) return
      const needle = filterEl.value.trim().toLowerCase()
      const rows = pickerState.tensors.filter(
        t => !needle || t.name.toLowerCase().includes(needle))

      const table = document.createElement('table')
      table.innerHTML =
        '<thead><tr><th>tensor</th><th>dims</th><th>type</th><th>decoded</th><th></th></tr></thead>'
      const tbody = document.createElement('tbody')

      for (const t of rows) {
        const why = blockedReason(t)
        const tr = document.createElement('tr')
        tr.className = why ? 'blocked' : 'pick'

        const mib = (t.decodedBytes / (1024 * 1024))
        const cells = [
          ['tname', t.name],
          ['', `[${t.shape[0]} x ${t.shape[1]}]` + (t.rank > 2 ? ` of ${t.dims.join('x')}` : '')],
          ['', t.quantType],
          ['', mib >= 0.05 ? `${mib.toFixed(1)} MiB` : `${t.decodedBytes} B`],
          ['why', why],
        ]
        for (const [cls, text] of cells) {
          const td = document.createElement('td')
          if (cls) td.className = cls
          td.textContent = text
          tr.appendChild(td)
        }
        if (!why) tr.addEventListener('click', () => choose(t))
        tbody.appendChild(tr)
      }

      table.appendChild(tbody)
      pickerList.replaceChildren(table)

      const usable = pickerState.tensors.filter(t => !blockedReason(t)).length
      pickerCount.textContent =
        `${rows.length} shown / ${pickerState.tensors.length} tensors, ${usable} mappable`
    }

    // Decode first, commit second. The scene is only rebuilt once the tensor is
    // actually in hand, so a slow or failing load leaves the previous valid
    // scene on screen instead of replacing it with placeholder zeros.
    async function choose(t) {
      const side = operandEl.value === 'right' ? 'right' : 'left'
      const leaf = params[side]
      const source = pickerState.source
      const [th, tw] = t.shape

      closePicker()
      ggufStatus(`decoding ${t.name} [${th} x ${tw}] ${t.quantType}...`)

      const result = await viz.requestGGUFTensor(source, t.name)

      if (result.stale) return          // a newer selection already won
      if (result.status === viz.GGUF_STATUS.ERROR) {
        ggufStatus(`could not load ${t.name}: ${result.error}`, 'error')
        return                          // params untouched, scene untouched
      }

      leaf.init           = 'gguf'
      leaf.gguf_url       = source
      leaf.gguf_tensor    = t.name
      leaf.gguf_row0      = 0
      leaf.gguf_col0      = 0
      leaf.gguf_transpose = false

      let note = ''
      if (fitEl.checked) {
        const h = Math.min(th, MAX_MATRIX_DIM)
        const w = Math.min(tw, MAX_MATRIX_DIM)
        // Keep the shared inner dimension consistent, the way the h/w controls do.
        leaf.h = h
        leaf.w = w
        viz.fixShape(h, w, leaf, [() => params], params)
        if (h < th || w < tw) {
          note = ` — showing the top-left ${h}x${w} of ${th}x${tw}`
        }
      } else if (th > leaf.h || tw > leaf.w) {
        note = ` — showing the top-left ${leaf.h}x${leaf.w} of ${th}x${tw}`
      }

      ggufStatus(`${side}: ${t.name} [${th} x ${tw}] ${t.quantType}${note}`)
      initFromParams()
    }

    async function openPickerForSource(source, label) {
      ggufStatus(`indexing ${label}...`)
      try {
        const tensors = await viz.indexGGUFSource(source)
        if (tensors.length === 0) {
          ggufStatus(`${label} contains no tensors`, 'error')
          return
        }
        pickerState = { source, label, tensors }
        pickerFile.textContent = label
        const usable = tensors.filter(t => !blockedReason(t)).length
        pickerSub.textContent =
          `${tensors.length} tensors, ${usable} mappable — click one to load it`
        filterEl.value = ''
        renderPickerList()
        pickerEl.classList.add('open')
        ggufStatus('')
        filterEl.focus()
      } catch (err) {
        ggufStatus(`could not read ${label}: ${err.message}`, 'error')
      }
    }

    document.body.addEventListener('dragover', e => e.preventDefault())
    document.body.addEventListener('drop', e => {
      e.preventDefault()
      const file = e.dataTransfer.files[0]
      if (!file) return
      if (!file.name.toLowerCase().endsWith('.gguf')) {
        ggufStatus(`${file.name} is not a .gguf file`, 'error')
        return
      }
      ggufStatus(`reading ${file.name}...`)
      const reader = new FileReader()
      reader.onerror = () => ggufStatus(`could not read ${file.name}`, 'error')
      reader.onload = ev => {
        const source = viz.registerLocalGGUFBuffer(file.name, ev.target.result)
        openPickerForSource(source, file.name)
      }
      reader.readAsArrayBuffer(file)
    })

    //
    // run
    //

    initFromSearchParams()
    animate()

  </script>
</body>

</html>
